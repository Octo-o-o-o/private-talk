name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new commit on the same branch / PR cancels older in-flight runs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test (Rust lib)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Tauri's lib crate links against system libraries even when we only
      # build the lib (not the .app/.dmg bundle), so the Ubuntu runner needs
      # webkit + gtk + a couple of helpers before `cargo test` will compile.
      - name: Install Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Bust cache when Cargo.lock changes.
          shared-key: tauri-lib

      - name: Run lib tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  frontend:
    name: vitest (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: pnpm test
