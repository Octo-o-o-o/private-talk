name: Bug Report
description: Report something that isn't working correctly
labels: ["kind:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Critical — blocks usage"
        - "High — major feature broken"
        - "Medium — inconvenient but workaround exists"
        - "Low — cosmetic / minor"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, environment info, etc.
