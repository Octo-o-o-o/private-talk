name: Feature Request
description: Suggest a new feature or enhancement
labels: ["kind:feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: What do you want?
      description: A clear description of the feature
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why?
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: done_definition
    attributes:
      label: Done definition
      description: How do we know this is complete?
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0 — Critical"
        - "P1 — High"
        - "P2 — Medium"
        - "P3 — Low / backlog"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references, related issues, etc.
