[target.aarch64-linux-android]
linker = "./tools/android-toolchain/aarch64-linux-android-clang"
ar = "tools/android-toolchain/llvm-ar"

[target.armv7-linux-androideabi]
linker = "./tools/android-toolchain/armv7a-linux-androideabi-clang"
ar = "tools/android-toolchain/llvm-ar"

[target.i686-linux-android]
linker = "./tools/android-toolchain/i686-linux-android-clang"
ar = "tools/android-toolchain/llvm-ar"

[target.x86_64-linux-android]
linker = "./tools/android-toolchain/x86_64-linux-android-clang"
ar = "tools/android-toolchain/llvm-ar"

[env]
CC_aarch64_linux_android = { value = "tools/android-toolchain/aarch64-linux-android-clang", relative = true }
AR_aarch64_linux_android = { value = "tools/android-toolchain/llvm-ar", relative = true }
CC_armv7_linux_androideabi = { value = "tools/android-toolchain/armv7a-linux-androideabi-clang", relative = true }
AR_armv7_linux_androideabi = { value = "tools/android-toolchain/llvm-ar", relative = true }
CC_i686_linux_android = { value = "tools/android-toolchain/i686-linux-android-clang", relative = true }
AR_i686_linux_android = { value = "tools/android-toolchain/llvm-ar", relative = true }
CC_x86_64_linux_android = { value = "tools/android-toolchain/x86_64-linux-android-clang", relative = true }
AR_x86_64_linux_android = { value = "tools/android-toolchain/llvm-ar", relative = true }
