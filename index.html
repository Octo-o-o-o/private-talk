<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Private Talk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (() => {
        const storageKey = "private-talk-ui-theme-mode";
        const storedMode = (() => {
          try {
            return window.localStorage.getItem(storageKey);
          } catch {
            return null;
          }
        })();

        const themeMode =
          storedMode === "light" || storedMode === "dark" || storedMode === "system"
            ? storedMode
            : "system";

        let resolvedTheme = "dark";

        try {
          if (themeMode === "light" || themeMode === "dark") {
            resolvedTheme = themeMode;
          } else if (typeof window.matchMedia === "function") {
            resolvedTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
        } catch {
          resolvedTheme = "dark";
        }

        document.documentElement.classList.toggle("dark", resolvedTheme === "dark");
        document.documentElement.dataset.themeMode = themeMode;
        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.style.colorScheme = resolvedTheme;
      })();
    </script>
    <style>
      html, body {
        background: #35A6FD;
        margin: 0;
        padding: 0;
      }
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        /* Extend behind safe areas on iOS */
        width: 100%;
        height: 100%;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #35A6FD;
        transition: opacity 0.3s ease;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash-screen img {
        width: 96px;
        height: 96px;
        border-radius: 20px;
      }
      #splash-screen .splash-tagline {
        margin-top: 24px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 0.5px;
        text-align: center;
        padding: 0 32px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="splash-screen">
      <img src="/splash-icon.png" alt="Private Talk" />
      <div class="splash-tagline">
        <script>
          (() => {
            const isZh = (navigator.language || '').toLowerCase().startsWith('zh');
            document.currentScript.parentElement.textContent = isZh
              ? '完全本地，零数据泄露的安全隐私聊天'
              : 'Fully local, zero data leakage private chat';
          })();
        </script>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
