[package]
name = "private-talk"
version = "0.1.0"
description = "Local-first lightweight desktop toolkit for LLM chat, TTS, and OpenClaw Agent debugging."
authors = ["Yixiao Wang"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Octo-o-o-o/private-talk"
homepage = "https://github.com/Octo-o-o-o/private-talk"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "private_talk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "multipart", "rustls-tls"] }
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
rand = "0.8"
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
chrono = "0.4"
anyhow = "1"
tokio-stream = "0.1"
base64 = "0.22"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSError", "NSLocale", "NSString", "NSURL"] }
objc2-speech = "0.3.2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3.2", features = ["UIApplication"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-native-stt-mobile = { path = "plugins/native-stt-mobile" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Devices_Enumeration", "Foundation", "Globalization", "Media_SpeechRecognition", "Win32_System_Com"] }

[profile.release]
strip = "debuginfo"
lto = "thin"
